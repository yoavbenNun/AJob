companies:
  - name: Microsoft
    careers_url: https://jobs.careers.microsoft.com/global/en/search?q=software%20intern
    enabled: true
    job_url_patterns:
      - /careers/job/
    allowed_job_hosts:
      - apply.careers.microsoft.com
  - name: Google
    careers_url: https://www.google.com/about/careers/applications/jobs/results/?q=software%20intern
    enabled: true
    job_url_patterns:
      - /about/careers/applications/jobs/results/
    allowed_job_hosts:
      - www.google.com
  - name: Amazon
    # Official Israel search, scoped to software/student roles. Rendered job
    # anchors are compatible with the generic scraper.
    careers_url: https://www.amazon.jobs/en/search?base_query=software%20student&country=ISR
    enabled: true
    job_url_patterns:
      - /en/jobs/
    allowed_job_hosts:
      - www.amazon.jobs
  - name: Apple
    # Official Israel-wide search. Early-career relevance remains enforced by
    # the shared filters after discovery.
    careers_url: https://jobs.apple.com/en-il/search?location=israel-ISR
    enabled: true
    job_url_patterns:
      - /en-il/details/
    allowed_job_hosts:
      - jobs.apple.com
  - name: NVIDIA
    # Uses the dedicated Workday JSON adapter rather than rendered anchors.
    careers_url: https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite
    enabled: true
    job_url_patterns:
      - /job/
    allowed_job_hosts:
      - nvidia.wd5.myworkdayjobs.com
  - name: Intel
    # Uses the dedicated Workday JSON adapter rather than rendered anchors.
    careers_url: https://intel.wd1.myworkdayjobs.com/en-US/External
    enabled: true
    job_url_patterns:
      - /job/
    allowed_job_hosts:
      - intel.wd1.myworkdayjobs.com
  - name: KLA
    # Official Israel Workday board; includes software student openings.
    careers_url: https://kla.wd1.myworkdayjobs.com/en-US/Israel
    enabled: true
    job_url_patterns:
      - /job/
    allowed_job_hosts:
      - kla.wd1.myworkdayjobs.com
  - name: F5
    # Official Workday board with Tel Aviv software and cloud internships.
    careers_url: https://ffive.wd5.myworkdayjobs.com/en-US/f5jobs
    enabled: true
    job_url_patterns:
      - /job/
    allowed_job_hosts:
      - ffive.wd5.myworkdayjobs.com
  - name: Motorola Solutions
    careers_url: https://motorolasolutions.wd5.myworkdayjobs.com/en-US/Careers
    enabled: true
    job_url_patterns:
      - /job/
    allowed_job_hosts:
      - motorolasolutions.wd5.myworkdayjobs.com
  - name: Red Hat
    careers_url: https://redhat.wd5.myworkdayjobs.com/en-US/Jobs
    enabled: true
    job_url_patterns:
      - /job/
    allowed_job_hosts:
      - redhat.wd5.myworkdayjobs.com
  - name: Clarivate
    # Official Workday source for Jerusalem junior and graduate software roles.
    careers_url: https://clarivate.wd3.myworkdayjobs.com/en-US/Clarivate_Careers
    enabled: true
    job_url_patterns:
      - /job/
    allowed_job_hosts:
      - clarivate.wd3.myworkdayjobs.com
  - name: Qualcomm
    # Official Workday source; broader bounded queries surface junior roles when open.
    careers_url: https://qualcomm.wd12.myworkdayjobs.com/en-US/External
    enabled: true
    job_url_patterns:
      - /job/
    allowed_job_hosts:
      - qualcomm.wd12.myworkdayjobs.com
  - name: Marvell
    # Official Workday board with current Israel student engineering postings;
    # shared filtering checks software responsibilities role by role.
    careers_url: https://marvell.wd1.myworkdayjobs.com/en-US/MarvellCareers
    enabled: true
    job_url_patterns:
      - /job/
    allowed_job_hosts:
      - marvell.wd1.myworkdayjobs.com
  - name: monday.com
    # The shared role and location filters reject non-Israel/non-junior results.
    careers_url: https://monday.com/careers
    enabled: true
    job_url_patterns:
      - /careers/
    allowed_job_hosts:
      - monday.com
  - name: Mobileye
    # Official Lever board narrowed to student roles. The shared filters still
    # enforce software relevance and the candidate's driving radius.
    careers_url: https://jobs.eu.lever.co/mobileye/?commitment=Student
    enabled: true
    job_url_patterns:
      - /mobileye/
    allowed_job_hosts:
      - jobs.eu.lever.co
  - name: Check Point
    # Official Israel search. Keep the source configurable because this legacy
    # careers site can change its query-string job links without notice.
    careers_url: https://careers.checkpoint.com/index.php?a=search&fa%5B%5D=country_ss%3AIsrael&module=cpcareers&q=&sort=
    # The page currently renders no usable job anchors in Playwright. Enable
    # only after a dedicated feed/adapter is verified.
    enabled: false
    job_url_patterns:
      - a=show
      - joborderid=
    allowed_job_hosts:
      - careers.checkpoint.com
  - name: CyberArk
    careers_url: https://www.cyberark.com/careers/
    # No stable, enumerable official listing has been verified yet.
    enabled: false
    job_url_patterns:
      - /job/
    allowed_job_hosts:
      - www.cyberark.com
  - name: SAP
    careers_url: https://jobs.sap.com/search/
    # Enable after an Israel-scoped listing is verified end to end.
    enabled: false
    job_url_patterns:
      - /job/
    allowed_job_hosts:
      - jobs.sap.com
  - name: AppsFlyer
    careers_url: https://www.appsflyer.com/jobs/
    # The public careers page still needs a verified job-feed adapter.
    enabled: false
    job_url_patterns:
      - /jobs/
    allowed_job_hosts:
      - www.appsflyer.com
  - name: Similarweb
    # Official Greenhouse board exposes public job-detail links.
    careers_url: https://job-boards.greenhouse.io/similarweb
    enabled: true
    job_url_patterns:
      - /jobs/
    allowed_job_hosts:
      - job-boards.greenhouse.io
  - name: Wix
    careers_url: https://careers.wix.com/positions
    # The current page loads job data outside normal anchor markup. Keep this
    # target documented until a dedicated Wix adapter is added in Phase 3.
    enabled: false
    job_url_patterns:
      - /position/
    allowed_job_hosts:
      - careers.wix.com
  - name: Cisco
    # Official careers listing; shared relevance and Israel filters narrow results.
    careers_url: https://careers.cisco.com/global/en/search-results?keywords=Israel
    enabled: true
    job_url_patterns:
      - /global/en/job/
    allowed_job_hosts:
      - careers.cisco.com
  - name: Palo Alto Networks
    # Official Israel careers search; shared filters select relevant roles.
    careers_url: https://jobs.paloaltonetworks.com/en/search-jobs?l=Israel
    enabled: true
    job_url_patterns:
      - /en/job/
      - /en/jobs/
    allowed_job_hosts:
      - jobs.paloaltonetworks.com
  - name: Taboola
    # Official careers page links to its public job detail pages.
    careers_url: https://www.taboola.com/careers
    enabled: true
    job_url_patterns:
      - /careers/job/
    allowed_job_hosts:
      - www.taboola.com
  - name: Fiverr
    # Official careers listing; shared filters enforce location and relevance.
    careers_url: https://www.fiverr.com/jobs
    enabled: true
    job_url_patterns:
      - /jobs/
    allowed_job_hosts:
      - www.fiverr.com
  - name: Rapyd
    # Official careers listing with public position detail links.
    careers_url: https://www.rapyd.net/company/careers-search/
    enabled: true
    job_url_patterns:
      - /company/careers/positions/
    allowed_job_hosts:
      - www.rapyd.net
  - name: Pagaya
    # Official Greenhouse board exposes public job-detail links.
    careers_url: https://job-boards.greenhouse.io/pagayais
    enabled: true
    job_url_patterns:
      - /jobs/
    allowed_job_hosts:
      - job-boards.greenhouse.io
  - name: Gong
    # Official Greenhouse board exposes public job-detail links.
    careers_url: https://job-boards.greenhouse.io/gongio
    enabled: true
    job_url_patterns:
      - /jobs/
    allowed_job_hosts:
      - job-boards.greenhouse.io
  - name: Applied Materials
    # Official Israel careers listing; shared filters select relevant roles.
    careers_url: https://jobs.appliedmaterials.com/en/search-jobs
    enabled: true
    job_url_patterns:
      - /en/job/
      - /en/jobs/
    allowed_job_hosts:
      - jobs.appliedmaterials.com
