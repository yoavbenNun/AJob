# Frozen example only. Cloud deployment has no current approval.
# A new activation review/approval is required; see docs/maintenance-mode.md.
# Existing scanner workflows are unaffected.
services:
  - type: web
    name: ajob-private-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.dashboard
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: AJOB_CLOUD_ENABLED
        value: "0"
      - key: AJOB_PUBLIC_ORIGIN
        sync: false
      - key: AJOB_CLOUD_BACKEND
        value: data_api
      - key: AJOB_SUPABASE_URL
        sync: false
      - key: AJOB_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AJOB_SUPABASE_AUTH_EMAIL
        sync: false
      - key: AJOB_SUPABASE_AUTH_PASSWORD
        sync: false
      - key: AJOB_SUPABASE_AUTH_SUBJECT
        sync: false
      - key: AJOB_OWNER_PASSWORD_HASH
        sync: false
