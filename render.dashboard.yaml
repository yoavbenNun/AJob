# Example only. Do not create/deploy until identity, grants, schema and transfer
# approvals are complete. Existing scanner workflows are unaffected.
services:
  - type: web
    name: ajob-private-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.dashboard
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: AJOB_CLOUD_ENABLED
        value: "1"
      - key: AJOB_PUBLIC_ORIGIN
        sync: false
      - key: AJOB_CLOUD_BACKEND
        value: data_api
      - key: AJOB_SUPABASE_URL
        sync: false
      - key: AJOB_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AJOB_SUPABASE_AUTH_EMAIL
        sync: false
      - key: AJOB_SUPABASE_AUTH_PASSWORD
        sync: false
      - key: AJOB_SUPABASE_AUTH_SUBJECT
        sync: false
      - key: AJOB_OWNER_PASSWORD_HASH
        sync: false
