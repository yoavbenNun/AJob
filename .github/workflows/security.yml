name: Security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: pip install -r requirements.txt -r requirements-audit.txt
      - name: Offline source and history secret scan
        run: python scripts/audit_secrets.py --history
      - name: Dependency advisory audit
        run: pip-audit --progress-spinner off
