name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows launcher and updater regressions
        shell: powershell
        run: |
          & ./tests/test_runtime_updater.ps1
          & ./tests/test_published_launcher.ps1
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 6
    env:
      # Disposable CI service only; never DATABASE_URL or repository secrets.
      AJOB_TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.2,<27"
      - run: pip install -r requirements.txt
      - name: Install Chromium and WebKit for dashboard browser regressions
        run: python -m playwright install --with-deps chromium webkit
      - run: python -m pytest
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag ai-job-search-agent .
      - run: docker run --rm --ipc=host ai-job-search-agent python -m src.main scan --dry-run
      - name: Build isolated cloud dashboard image
        run: docker build --file Dockerfile.dashboard --tag ajob-cloud-dashboard .
      - name: Verify cloud image is opt-in and has no import-time local stores
        run: >-
          docker run --rm ajob-cloud-dashboard python -c
          "from pathlib import Path; from src.web.cloud import create_cloud_app;
          assert not Path('data').exists();
          import os; assert os.environ.get('AJOB_CLOUD_ENABLED') != '1'"
