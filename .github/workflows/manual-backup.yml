name: One-time encrypted AJob backup

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "age public recipient (age1...); keep the private key offline"
        required: true
        type: string

permissions:
  contents: read

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install encryption tool
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Export application schemas directly into encryption
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          test -n "$DATABASE_URL"
          [[ "$RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]] || { echo "Invalid age public recipient"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ajob-backup"
          export PGCONNECT_TIMEOUT=15
          # Expand the URI inside the container, never in host Docker arguments.
          # Explicit READ ONLY does not depend on pooler startup-option support.
          if ! inventory=$(docker run --rm -e DATABASE_URL -e PGCONNECT_TIMEOUT \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 \
            sh -c 'exec psql -X --dbname="$DATABASE_URL" -v ON_ERROR_STOP=1 -Atq -c "$1"' sh \
            "BEGIN READ ONLY; SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('job_postings','scan_runs','scan_source_metrics','scan_windows','delivery_leases','dispatcher_state','notification_batches','notification_outbox'); COMMIT;" \
            2>/dev/null); then
            echo "::error::Backup preflight connection or inventory query failed; inspect connection privately."
            exit 1
          fi
          if [[ "$inventory" != "8" ]]; then
            echo "::error::Required AJob tables are missing or inaccessible; backup aborted."
            exit 1
          fi
          # Optional closure/alert tables are not required, but schema-wide dump
          # includes them whenever present. No existing table is excluded.
          # pg_dump fails on inaccessible/RLS-filtered tables; never use
          # --enable-row-security or selectively omit failed tables.
          if ! docker run --rm -e DATABASE_URL -e PGCONNECT_TIMEOUT \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 \
            sh -c 'exec pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --schema=public --schema="ajob_*"' \
            2>/dev/null | age -r "$RECIPIENT" -o "$RUNNER_TEMP/ajob-backup/database.dump.age"; then
            rm -f "$RUNNER_TEMP/ajob-backup/database.dump.age"
            echo "::error::Complete application dump or encryption failed. Check connection reachability, SELECT/RLS rights and server compatibility privately; no partial backup retained."
            exit 1
          fi
          cd "$RUNNER_TEMP/ajob-backup"
          sha256sum database.dump.age > database.dump.age.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ajob-encrypted-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/ajob-backup/
          retention-days: 1
          if-no-files-found: error
      - name: Remove encrypted runner copy
        if: always()
        run: rm -f "$RUNNER_TEMP/ajob-backup/database.dump.age" "$RUNNER_TEMP/ajob-backup/database.dump.age.sha256"
