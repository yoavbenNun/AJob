name: Scheduled job scan

on:
  schedule:
    # Backup wake-ups; the database chooses current work, not this cron's age.
    # Supabase pg_cron is the independent primary watchdog.
    - cron: "17 5 * * *"
    - cron: "17 6 * * *"
    - cron: "17 8 * * *"
    - cron: "17 9 * * *"
    - cron: "17 13 * * *"
    - cron: "17 14 * * *"
    - cron: "47 5 * * *"
    - cron: "47 6 * * *"
    - cron: "47 8 * * *"
    - cron: "47 9 * * *"
    - cron: "47 13 * * *"
    - cron: "47 14 * * *"
  workflow_dispatch:
    inputs:
      delivery_slot:
        description: "Optional canonical origin slot for audit; current DB work is selected"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: scheduled-job-scan
  cancel-in-progress: false
  # Default single pending run: newer wake-ups replace redundant pending ones.
  # All wake-ups reconcile DB windows, so replacing a trigger cannot lose a slot.

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate optional dispatch origin
        shell: bash
        env:
          DISPATCH_DELIVERY_SLOT: ${{ inputs.delivery_slot }}
        run: |
          if [ -n "$DISPATCH_DELIVERY_SLOT" ]; then
            python -m src.scheduling.israel_schedule --delivery-slot "$DISPATCH_DELIVERY_SLOT"
          fi
          echo "Wake-up only: current database windows determine scan and mail work."
      - name: Require persistent PostgreSQL storage
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repository secret is required for scheduled scans." >&2
            exit 1
          fi
      - name: Build scanner image
        run: docker build --tag ai-job-search-agent .
      - name: Reconcile windows and retry pending notifications
        run: >-
          docker run --rm --ipc=host
          -e SMTP_HOST -e SMTP_PORT -e SMTP_USERNAME -e SMTP_PASSWORD
          -e SMTP_FROM -e SMTP_TO -e SMTP_USE_TLS
          -e DATABASE_URL
          -e CANDIDATE_PROFILE_JSON
          ai-job-search-agent python -m src.main scheduled-tick
      - name: Publish business status independently of workflow result
        if: ${{ always() }}
        run: |
          docker run --rm -e DATABASE_URL ai-job-search-agent python -m src.main scan-report >> "$GITHUB_STEP_SUMMARY"
