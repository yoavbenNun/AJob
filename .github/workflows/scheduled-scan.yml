name: Scheduled job scan

on:
  schedule:
    # GitHub Actions schedules are UTC. This runs at 07:17/08:17 Israel time,
    # depending on daylight saving time.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
    steps:
      - uses: actions/checkout@v5
      - name: Require persistent PostgreSQL storage
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repository secret is required for scheduled scans." >&2
            exit 1
          fi
      - name: Build scanner image
        run: docker build --tag ai-job-search-agent .
      - name: Scan career pages and send summary
        if: ${{ env.SMTP_HOST != '' }}
        run: >-
          docker run --rm
          -e SMTP_HOST -e SMTP_PORT -e SMTP_USERNAME -e SMTP_PASSWORD
          -e SMTP_FROM -e SMTP_TO -e SMTP_USE_TLS
          -e DATABASE_URL
          -e CANDIDATE_PROFILE_JSON
          ai-job-search-agent python -m src.main scan --email-summary
      - name: Scan career pages without email
        if: ${{ env.SMTP_HOST == '' }}
        run: docker run --rm -e DATABASE_URL ai-job-search-agent
